<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pistas Cruzadas / Cross Clues</title>
<style>
  :root{
    --cream:#FBF6E9; --cream-2:#F3EBD6;
    --aqua:#5CC2C6; --aqua-dark:#2F8E93;
    --pink:#F2879F; --pink-soft:#FBDCE3;
    --wine:#8E2244; --ink:#243840; --ink-soft:#5B6F78; --ok:#3F9E6C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
  .display{font-family:"Bookman Old Style","Bitter",Georgia,"Times New Roman",serif;font-weight:700}

  .wrap{max-width:1040px;margin:0 auto;padding:20px 18px 60px}
  header.top{background:repeating-linear-gradient(-16deg,var(--aqua) 0 26px,transparent 26px 92px),var(--cream-2);border-bottom:3px solid var(--ink)}
  header.top .inner{max-width:1040px;margin:0 auto;padding:22px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  h1{margin:0;font-size:clamp(28px,5.5vw,50px);letter-spacing:-.5px;line-height:1;text-shadow:2px 2px 0 var(--cream)}
  h1 .cruz{color:var(--wine)}
  .tagline{margin:6px 0 0;font-size:14px;background:var(--cream);display:inline-block;padding:2px 8px;border-radius:4px}

  .langswitch{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff;flex:none}
  .langswitch button{border:0;border-radius:0;background:#fff;padding:7px 14px;font-weight:700;font-size:14px}
  .langswitch button.on{background:var(--ink);color:#fff}

  h2{font-size:22px;margin:0 0 10px}
  h3{font-size:16px;margin:0 0 8px}
  p{margin:0 0 12px}
  .muted{color:var(--ink-soft);font-size:14px}

  .panel{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:5px 5px 0 rgba(36,56,64,.12)}
  .panel.aqua{background:#EAF8F8;border-color:var(--aqua-dark)}
  .panel.pink{background:var(--pink-soft);border-color:var(--pink)}
  .choice{display:grid;gap:16px;grid-template-columns:1fr 1fr}
  @media(max-width:700px){.choice{grid-template-columns:1fr}}

  button{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:8px;background:#fff;padding:10px 16px;transition:transform .06s ease}
  button:active{transform:translateY(2px)}
  button:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
  .btn-main{background:var(--aqua);font-weight:700}
  .btn-main:hover{background:var(--aqua-dark);color:#fff}
  .btn-pink{background:var(--pink);font-weight:700}
  .btn-ghost{background:transparent}
  .btn-big{font-size:18px;padding:14px 22px;width:100%}
  .btn-ok{background:#CFEDDC;font-weight:700;border-color:var(--ok)}
  .btn-no{background:#FADCD9;font-weight:700;border-color:#C2453A}

  input,select{font:inherit;border:2px solid var(--ink);border-radius:8px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
  .field{margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .hidden{display:none !important}

  .status{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .chip{border:2px solid var(--ink);border-radius:8px;background:#fff;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;min-width:108px}
  .chip .k{font-size:11px;color:var(--ink-soft);font-weight:600}
  .chip .v{font-size:22px;font-weight:700;line-height:1.1}
  .chip.code .v{letter-spacing:1px;color:var(--wine);font-size:20px}
  .chip.timer.low .v{color:#C2453A}

  .board-scroll{overflow-x:auto;padding-bottom:6px}
  table.grid{border-collapse:separate;border-spacing:6px;margin:0 auto}
  table.grid th,table.grid td{padding:0}
  .head{width:118px;border:2px solid var(--ink);border-radius:8px;padding:8px 6px;text-align:center}
  .head.col{background:var(--pink-soft)}
  .head.row{background:#EAF8F8}
  .head .axis{font-size:26px;font-weight:700;line-height:1;font-family:"Bookman Old Style",Georgia,serif}
  .head .word{font-size:12px;font-weight:700;letter-spacing:.3px;margin-top:3px;word-break:break-word}
  .corner{width:118px}
  .cell{width:118px;height:74px;border:2px dashed #B9C7CD;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#B9C7CD;background:#fff}
  .cell.done{border-style:solid;border-color:var(--ok);background:#DFF2E7;color:var(--ok)}
  @media(max-width:620px){.head,.corner,.cell{width:84px}.cell{height:60px}.head .word{font-size:10px}}

  .turn{border:2px solid var(--ink);border-radius:10px;background:var(--cream-2);padding:18px;margin-top:18px;text-align:center}
  .turn .cardno{font-size:15px;color:var(--ink-soft);font-weight:600}
  .turn .who{font-size:30px;font-weight:700;margin:2px 0 4px;font-family:"Bookman Old Style",Georgia,serif}
  .turn .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}

  .stepper{display:flex;align-items:center;gap:12px;justify-content:center}
  .stepper input{width:110px;text-align:center;font-size:26px;font-weight:700}
  .stepper button{width:52px;height:52px;font-size:22px;font-weight:700}
  .reveal{margin-top:18px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:24px;text-align:center}
  .coord{font-size:64px;font-weight:700;letter-spacing:4px;line-height:1;font-family:"Bookman Old Style",Georgia,serif;color:var(--wine)}
  .words{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .wordchip{border:2px solid var(--ink);border-radius:8px;padding:8px 14px;font-weight:700}
  .wordchip.r{background:#EAF8F8}
  .wordchip.c{background:var(--pink-soft)}
  .warn{background:var(--pink-soft);border:2px solid var(--pink);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:16px}

  details{border-top:2px solid var(--ink);padding-top:12px;margin-top:6px}
  summary{cursor:pointer;font-weight:700}
  ul{margin:8px 0 0;padding-left:20px}
  li{margin-bottom:6px}

  table.score{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}
  table.score th,table.score td{border:1px solid #C9D4D9;padding:6px 8px;text-align:center}
  table.score th{background:var(--cream-2)}
  table.score td.lbl{text-align:left;font-weight:700}
  tr.me td{background:#FFF6BF}

  .final{text-align:center}
  .final .verdict{font-size:44px;font-weight:700;font-family:"Bookman Old Style",Georgia,serif;color:var(--wine);margin:6px 0}
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div>
      <h1 class="display"><span id="t1">Pistas</span> <span class="cruz" id="t2">Cruzadas</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="langswitch">
      <button id="langES" onclick="setLang('ES')">ES</button>
      <button id="langEN" onclick="setLang('EN')">EN</button>
    </div>
  </div>
</header>

<div class="wrap">

<!-- ============ INICIO ============ -->
<section id="home">
  <div class="panel">
    <h2 class="display" data-i18n="howTitle"></h2>
    <p data-i18n="howP1"></p>
    <p class="muted" data-i18n="howP2"></p>
  </div>

  <div class="choice">
    <div class="panel aqua">
      <h2 class="display" data-i18n="boardTitle"></h2>
      <p class="muted" data-i18n="boardSub"></p>
      <div class="field">
        <label for="size" data-i18n="sizeLabel"></label>
        <select id="size"></select>
      </div>
      <div class="field">
        <label for="minutes" data-i18n="timerLabel"></label>
        <select id="minutes"></select>
      </div>
      <div class="field">
        <label for="names" data-i18n="namesLabel"></label>
        <input id="names" placeholder="Joel, Juana, Oliver, Victoria…">
      </div>
      <button class="btn-main btn-big" data-i18n="createBtn" onclick="createGame()"></button>
    </div>

    <div class="panel pink">
      <h2 class="display" data-i18n="joinTitle"></h2>
      <p class="muted" data-i18n="joinSub"></p>
      <div class="field">
        <label for="joinCode" data-i18n="codeLabel"></label>
        <input id="joinCode" placeholder="EN-C-4821" autocomplete="off" style="text-transform:uppercase;font-size:20px;font-weight:700;letter-spacing:1px">
      </div>
      <button class="btn-pink btn-big" data-i18n="joinBtn" onclick="joinGame()"></button>
      <p id="joinError" class="muted hidden" style="color:#C2453A;font-weight:600;margin-top:10px"></p>
    </div>
  </div>

  <div class="panel">
    <details open>
      <summary data-i18n="rulesTitle"></summary>
      <ul>
        <li data-i18n="rule1"></li>
        <li data-i18n="rule2"></li>
        <li data-i18n="rule3"></li>
        <li data-i18n="rule4"></li>
        <li data-i18n="rule5"></li>
        <li data-i18n="rule6"></li>
      </ul>
    </details>
  </div>
</section>

<!-- ============ TABLERO ============ -->
<section id="board" class="hidden">
  <div class="status">
    <div class="chip code"><span class="k" data-i18n="kCode"></span><span class="v" id="bCode">—</span></div>
    <div class="chip"><span class="k" data-i18n="kGrid"></span><span class="v" id="bSize">—</span></div>
    <div class="chip"><span class="k" data-i18n="kHits"></span><span class="v" id="bHits">0</span></div>
    <div class="chip"><span class="k" data-i18n="kUsed"></span><span class="v" id="bUsed">0</span></div>
    <div class="chip timer" id="bTimerChip"><span class="k" data-i18n="kTimer"></span><span class="v" id="bTimer">—</span></div>
    <button class="btn-ghost" id="bTimerBtn" onclick="toggleTimer()"></button>
  </div>

  <div class="panel">
    <div class="board-scroll"><div id="gridHolder"></div></div>

    <div class="turn" id="turnBox">
      <div class="cardno" id="tCardNo"></div>
      <div class="who display" id="tWho"></div>
      <div class="muted" data-i18n="turnHint"></div>
      <div class="actions">
        <button class="btn-ok" data-i18n="btnHit" onclick="resolve(true)"></button>
        <button class="btn-no" data-i18n="btnMiss" onclick="resolve(false)"></button>
        <button class="btn-ghost" data-i18n="btnEnd" onclick="endGame()"></button>
      </div>
    </div>

    <div class="final hidden" id="finalBox">
      <h2 class="display" data-i18n="finalTitle"></h2>
      <div class="muted" data-i18n="finalSub"></div>
      <div class="verdict"><span id="fHits">0</span> <span data-i18n="finalCards"></span></div>
      <div class="display" style="font-size:26px" id="fVerdict"></div>
      <p class="muted" id="fComment"></p>
      <div id="scoreTable"></div>
      <button class="btn-main" style="margin-top:16px" data-i18n="btnAgain" onclick="location.reload()"></button>
    </div>
  </div>
</section>

<!-- ============ JUGADOR ============ -->
<section id="player" class="hidden">
  <div class="warn" data-i18n="pWarn"></div>

  <div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:16px">
      <div>
        <div class="muted" data-i18n="pGame"></div>
        <div class="display" style="font-size:24px;letter-spacing:1px;color:var(--wine)" id="pCode">—</div>
      </div>
      <div style="text-align:right">
        <div class="muted" data-i18n="kGrid"></div>
        <div class="display" style="font-size:20px" id="pSize">—</div>
      </div>
    </div>

    <h3 data-i18n="pNumTitle"></h3>
    <p class="muted" data-i18n="pNumSub"></p>
    <div class="stepper">
      <button onclick="stepCard(-1)">−</button>
      <input id="pNum" type="number" min="1" value="1" onchange="hideCard()" oninput="hideCard()">
      <button onclick="stepCard(1)">+</button>
    </div>

    <button class="btn-pink btn-big" style="margin-top:18px" id="pRevealBtn" data-i18n="pReveal" onclick="revealCard()"></button>

    <div class="reveal hidden" id="pRevealBox">
      <div class="muted" data-i18n="pGetThem"></div>
      <div class="coord" id="pCoord">B3</div>
      <div class="words">
        <div class="wordchip r" id="pWordR">—</div>
        <div class="wordchip c" id="pWordC">—</div>
      </div>
      <p class="muted" style="margin-top:16px" data-i18n="pClueRule"></p>
      <button class="btn-ghost" data-i18n="pHide" onclick="hideCard()"></button>
    </div>
  </div>

  <div class="panel aqua">
    <h3 class="display" data-i18n="pGridTitle"></h3>
    <div class="board-scroll"><div id="pGridHolder"></div></div>
  </div>

  <button class="btn-ghost" data-i18n="pExit" onclick="location.reload()"></button>
</section>

</div>

  rule3:"They give a one-word clue that crosses the two key words at that coordinate. If they're \"Doctor\" and \"Bear\", you could say \"Vet\".",
  rule4:"Everyone else talks it over and a single person answers for the group, naming the coordinate.",
  rule5:"If they get it, the square is marked. If they miss, the card is discarded and the coordinate stays secret.",
  rule6:"A clue can't share a root with the key words, and clues can't be reused.",
  kCode:"Code", kGrid:"Grid", kHits:"Correct", kUsed:"Cards used", kTimer:"Timer",
  timerStart:"Start timer", timerPause:"Pause timer",
  cardNo:"Card {n} of {t}", turnWho:"{name}'s turn", turnAnyone:"Next person's turn",
  turnHint:"That person opens player mode, enters the card number and gives their clue.",
  btnHit:"They got it", btnMiss:"They missed", btnEnd:"End game",
  finalTitle:"Game over", finalSub:"You correctly placed", finalCards:"cards", btnAgain:"Play again",
  scoreResult:"Result", scoreHits:"Correct",
  verdicts:["Disaster","Decent","Great","Incredible"],
  comments:["You clearly don't understand each other yet.","There's a basic grasp of how the others think.","Nice! You've got a strong connection.","Perfect score! We suspect telepathy was involved."],
  ranges:{R:["under 4","4 to 5","6 to 7","8 or more"],C:["under 8","8 to 11","12 to 14","15 or more"],E:["under 12","12 to 16","17 to 22","23 or more"]},
  pWarn:"This view is private: don't share it on screen, and don't peek at card numbers that aren't yours.",
  pGame:"Game", pNumTitle:"Your card number", pNumSub:"The shared board tells you which card is yours. Type that number here.",
  pReveal:"Show my coordinate", pGetThem:"Get them to guess",
  pClueRule:"Say a single word that crosses the two. No shared roots, no repeating earlier clues.",
  pHide:"Hide", pGridTitle:"The grid words", pExit:"Exit"
}};

const SIZES = {R:3, C:4, E:5};
const CUTS  = {R:[4,6,8], C:[8,12,15], E:[12,17,23]};

/* ================= azar determinístico ================= */
function hashCode(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildGame(code){
  let raw = (code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  let lang = "ES";
  if(raw.startsWith("ES")||raw.startsWith("EN")){ lang = raw.slice(0,2); raw = raw.slice(2); }
  if(!/^[RCE]\d{3,6}$/.test(raw)) return null;
  const letter = raw[0];
  const key = lang+"-"+letter+"-"+raw.slice(1);
  const n = SIZES[letter];
  const rng = mulberry32(hashCode(key));
  const pool = shuffled(WORDLISTS[lang], rng);
  const coords = [];
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) coords.push(String.fromCharCode(65+r)+(c+1));
  return {code:key, lang, letter, n, rowWords:pool.slice(0,n), colWords:pool.slice(n,2*n), deck:shuffled(coords,rng)};
}

/* ================= estado ================= */
let lang="ES", G=null, players=[], idx=0, hits=0, solved={}, totalSeconds=0, remaining=0, ticking=false, tick=null;
function t(k){return T[lang][k];}
function show(id){["home","board","player"].forEach(s=>document.getElementById(s).classList.toggle("hidden", s!==id));}

function setLang(L){
  lang = L;
  document.documentElement.lang = L.toLowerCase();
  document.getElementById("langES").classList.toggle("on", L==="ES");
  document.getElementById("langEN").classList.toggle("on", L==="EN");
  document.getElementById("t1").textContent = t("title1");
  document.getElementById("t2").textContent = t("title2");
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });

  const sizeSel = document.getElementById("size"), keep = sizeSel.value || "C";
  sizeSel.innerHTML = ["R","C","E"].map(k=>'<option value="'+k+'">'+t("sizes")[k]+'</option>').join("");
  sizeSel.value = keep;
  const minSel = document.getElementById("minutes"), keepM = minSel.value || "10";
  minSel.innerHTML = '<option value="0">'+t("noTimer")+'</option>' + [5,10,15,20].map(m=>'<option value="'+m+'">'+m+' '+t("minutes")+'</option>').join("");
  minSel.value = keepM;

  document.getElementById("bTimerBtn").textContent = ticking ? t("timerPause") : t("timerStart");
  if(G && !document.getElementById("board").classList.contains("hidden")) renderTurn();
  if(G && !document.getElementById("player").classList.contains("hidden")) document.getElementById("pSize").textContent = t("sizes")[G.letter].split(" ")[0];
}

/* ================= tablero ================= */
function createGame(){
  const letter = document.getElementById("size").value;
  G = buildGame(lang + "-" + letter + "-" + String(Math.floor(1000+Math.random()*9000)));
  const raw = document.getElementById("names").value.trim();
  players = raw ? raw.split(",").map(s=>s.trim()).filter(Boolean) : [];
  totalSeconds = parseInt(document.getElementById("minutes").value,10)*60;
  remaining = totalSeconds; idx=0; hits=0; solved={};
  document.getElementById("bCode").textContent = G.code;
  document.getElementById("bSize").textContent = t("sizesShort")[G.letter];
  document.getElementById("bTimer").textContent = totalSeconds ? fmt(remaining) : "—";
  document.getElementById("bTimerBtn").classList.toggle("hidden", !totalSeconds);
  document.getElementById("gridHolder").innerHTML = gridHTML(G, solved);
  renderTurn(); show("board");
}

function gridHTML(g, done){
  let h = '<table class="grid"><tr><th class="corner"></th>';
  for(let c=0;c<g.n;c++) h += '<th class="head col"><div class="axis">'+(c+1)+'</div><div class="word">'+g.colWords[c]+'</div></th>';
  h += '</tr>';
  for(let r=0;r<g.n;r++){
    h += '<tr><th class="head row"><div class="axis">'+String.fromCharCode(65+r)+'</div><div class="word">'+g.rowWords[r]+'</div></th>';
    for(let c=0;c<g.n;c++){
      const id = String.fromCharCode(65+r)+(c+1), ok = done && done[id];
      h += '<td><div class="cell'+(ok?' done':'')+'">'+(ok?id:'')+'</div></td>';
    }
    h += '</tr>';
  }
  return h+'</table>';
}

function renderTurn(){
  document.getElementById("tCardNo").textContent = t("cardNo").replace("{n}", idx+1).replace("{t}", G.deck.length);
  document.getElementById("tWho").textContent = players.length
    ? t("turnWho").replace("{name}", players[idx % players.length])
    : t("turnAnyone");
  document.getElementById("bHits").textContent = hits;
  document.getElementById("bUsed").textContent = idx;
  document.getElementById("bSize").textContent = t("sizesShort")[G.letter];
}

function resolve(ok){
  if(ok){ solved[G.deck[idx]] = true; hits++; }
  idx++;
  document.getElementById("gridHolder").innerHTML = gridHTML(G, solved);
  if(idx >= G.deck.length){ endGame(); return; }
  renderTurn();
}

function endGame(){
  stopTimer();
  document.getElementById("turnBox").classList.add("hidden");
  document.getElementById("finalBox").classList.remove("hidden");
  document.getElementById("gridHolder").innerHTML = gridHTML(G, solved);
  document.getElementById("bHits").textContent = hits;
  document.getElementById("bUsed").textContent = idx;
  document.getElementById("fHits").textContent = hits;
  const cuts = CUTS[G.letter];
  let lvl = 0;
  if(hits >= cuts[2]) lvl = 3; else if(hits >= cuts[1]) lvl = 2; else if(hits >= cuts[0]) lvl = 1;
  document.getElementById("fVerdict").textContent = t("verdicts")[lvl];
  document.getElementById("fComment").textContent = t("comments")[lvl];
  let tbl = '<table class="score"><tr><th>'+t("scoreResult")+'</th><th>'+t("scoreHits")+'</th></tr>';
  t("verdicts").forEach((v,i)=>{ tbl += '<tr class="'+(i===lvl?"me":"")+'"><td class="lbl">'+v+'</td><td>'+t("ranges")[G.letter][i]+'</td></tr>'; });
  document.getElementById("scoreTable").innerHTML = tbl+'</table>';
}

/* ================= reloj ================= */
function fmt(s){const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0");}
function toggleTimer(){ ticking ? stopTimer() : startTimer(); }
function startTimer(){
  if(!totalSeconds) return;
  ticking = true;
  document.getElementById("bTimerBtn").textContent = t("timerPause");
  tick = setInterval(()=>{
    remaining--;
    document.getElementById("bTimer").textContent = fmt(Math.max(0,remaining));
    document.getElementById("bTimerChip").classList.toggle("low", remaining<=60);
    if(remaining<=0){ stopTimer(); endGame(); }
  },1000);
}
function stopTimer(){ ticking=false; clearInterval(tick); const b=document.getElementById("bTimerBtn"); if(b) b.textContent=t("timerStart"); }

/* ================= jugador ================= */
function joinGame(){
  const g = buildGame(document.getElementById("joinCode").value);
  const err = document.getElementById("joinError");
  if(!g){ err.textContent = t("joinErr"); err.classList.remove("hidden"); return; }
  err.classList.add("hidden");
  G = g;
  setLang(G.lang);
  document.getElementById("pCode").textContent = G.code;
  document.getElementById("pSize").textContent = t("sizes")[G.letter].split(" ")[0];
  document.getElementById("pNum").max = G.deck.length;
  document.getElementById("pGridHolder").innerHTML = gridHTML(G, null);
  hideCard(); show("player");
}
function stepCard(d){
  const el = document.getElementById("pNum");
  el.value = Math.min(Math.max(parseInt(el.value||"1",10)+d, 1), G.deck.length);
  hideCard();
}
function hideCard(){
  document.getElementById("pRevealBox").classList.add("hidden");
  document.getElementById("pRevealBtn").classList.remove("hidden");
}
function revealCard(){
  let v = Math.min(Math.max(parseInt(document.getElementById("pNum").value||"1",10), 1), G.deck.length);
  document.getElementById("pNum").value = v;
  const coord = G.deck[v-1];
  const r = coord.charCodeAt(0)-65, c = parseInt(coord.slice(1),10)-1;
  document.getElementById("pCoord").textContent = coord;
  document.getElementById("pWordR").textContent = String.fromCharCode(65+r)+" · "+G.rowWords[r];
  document.getElementById("pWordC").textContent = (c+1)+" · "+G.colWords[c];
  document.getElementById("pRevealBox").classList.remove("hidden");
  document.getElementById("pRevealBtn").classList.add("hidden");
}

document.getElementById("joinCode").addEventListener("keydown", e=>{ if(e.key==="Enter") joinGame(); });
setLang((navigator.language||"es").toLowerCase().startsWith("en") ? "EN" : "ES");
</script>
